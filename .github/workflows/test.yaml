name: Test skills

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run offline tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider tests/test_portability.py skills/ec-policy-debugging/summarize_violations_test.py -q
